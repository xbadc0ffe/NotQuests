name: E2E command sweep

# Boots a real Paper server with the freshly built plugin and runs every registered command type
# through the console, failing the build on any parser/handler error, exception, or a newly added
# objective/action/condition/trigger type that ships without a test command. Console-driven only
# (no Minecraft client) — see e2e/README.md.

on:
  push:
    # FORK DIVERGENCE: this fork's trunk is `main`, but it is NOT the same branch as
    # upstream AlessioGr/NotQuests' `main` — same name, unrelated history.
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run server-side command sweep
        run: ./e2e/run-sweep.sh

      # Blocking again as of 2026-08-19. This step was temporarily non-blocking for one run
      # because its assertions had never been evaluated — every CI run since it landed
      # (16022a5d) died at the first assertion on a missing ripgrep. Run 32313184030 at
      # 4403460b produced the first honest full-file result: all nine assertions and the
      # error scan passed, and BetonQuest 3.0.0 does enable on Paper 26.2 despite declaring
      # api-version 1.18. The removal condition is met.
      - name: Run BetonQuest 3 server-side command sweep
        run: ./e2e/run-betonquest-sweep.sh

      - name: Upload server log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs
          # nq-betonquest-server.clean.log is the ANSI-stripped file the BetonQuest assertions
          # actually grep — without it a failure cannot be reproduced locally without re-running
          # the perl filter. nq-e2e-{commands,metadata}.json are what analyze.py's schema and
          # registry gates read, staged into /tmp by run-sweep.sh; nq-betonquest-* are the same
          # exports taken from the BetonQuest run, and diffing the pair shows whether the
          # BetonQuest types registered and whether `integrationOnly` carries any information.
          # Everything stays under /tmp on purpose: one common ancestor keeps the artifact flat.
          path: |
            /tmp/nq-e2e-server.log
            /tmp/nq-betonquest-server.log
            /tmp/nq-betonquest-server.clean.log
            /tmp/nq-e2e-commands.json
            /tmp/nq-e2e-metadata.json
            /tmp/nq-betonquest-commands.json
            /tmp/nq-betonquest-metadata.json
          if-no-files-found: ignore
